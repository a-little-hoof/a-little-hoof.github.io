- id: distribution-coverage
  title: "Visualizing Distribution Coverage in Generative Diffusion Models"
  year: 2026
  venue: Preprint · 2026
  authors: "<strong>Yifei Wang</strong>, Xiaoyu Wu, Tsu-Jui Fu, Chen Chen, Liang-Chieh Chen, Zhe Gan, and Chen Wei"
  paper: https://arxiv.org/abs/2609.38853
  selected: true
  # Figure 1 from https://arxiv.org/html/2609.38853v1/fig_cfg.svg
  image: /images/publications/distribution-coverage.svg
  image_layout: wide
  image_width: 542
  image_height: 193
  image_alt: "Sampling-budget curves and per-prompt success distributions illustrating the quality–coverage tradeoff"
  summary: "Pass@k exposes a quality–coverage tradeoff in diffusion distillation: distribution-matching methods can improve single-draw quality while losing coverage across image and video generation."

